<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice FEH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    <style>
        .small-container{
            width: 27%;
        }
        .very-small-container{
            width: 10%;
        }
    </style>
</head>
<body>
    <div class="container-fluid very-small-container bg-secondary text-white" style="box-shadow: 0px 6px 5px 0px rgba(0,0,0,0.75);
    -webkit-box-shadow: 0px 6px 5px 0px rgba(0,0,0,0.75);
    -moz-box-shadow: 0px 6px 5px 0px rgba(0,0,0,0.75);">

    <details ontoggle ="message()">
        <summary>Instructions</summary>
        <i> Enter two number finds its sum</i>
    </details>

    </div>

    <br>
    
    <div class="container bg-secondary text-white p-3 text-center small-container rounded" style="box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);
    -webkit-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);
    -moz-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);">
    <form>
            <label>Enter the 1st number:</label>
            <input type="number" id="num1" placeholder="type here....">
        <br>
        <br>
            <label>Enter the 2nd number:</label>
            <input type="number" id="num2" placeholder="type here....">
        <br>
        <br>
            <button type="button" onclick="plus()"> PLUS </button>
            <button type="button" onclick="minus()"> MINUS </button>
            <span> <h1 id="result"> ANSWER </h1> </span>
    </form>
    </div>

    <script>
        function message() {
            alert("try it");
        }

        function plus (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) + Number (numb2);

            document.getElementById('result').innerHTML= 'Answer is' + ' ' + sum;
        }
        function minus (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) - Number (numb2);

            document.getElementById('result').innerHTML= 'Answer is' + ' ' + sum;
        }
    </script>
</body>
</html>
